# ~/.config/tmux/tmux.conf

# --- colors / terminal -------------------------------------------------------
# tmux advertises itself as tmux-256color; the OUTER terminal is xterm-ghostty.
set  -g default-terminal "tmux-256color"
# Truecolor (RGB) passthrough for the terminals you actually attach from.
set  -ag terminal-overrides ",xterm-ghostty:RGB"
set  -ag terminal-overrides ",xterm-256color:RGB"

# --- general -----------------------------------------------------------------
set  -g  mouse on                 # select / resize / scroll with the mouse
set  -g  history-limit 50000
set  -sg escape-time 10           # don't lag the <Esc> key (helps Neovim)
set  -g  focus-events on          # let Neovim see focus (autoread, etc.)
set  -g  base-index 1             # number windows from 1
setw -g  pane-base-index 1
set  -g  renumber-windows on
setw -g  mode-keys vi             # vi keys in copy mode

# When two devices attach to the SAME session, size to each client
# independently instead of the smallest common size.
setw -g aggressive-resize on

# --- prefix ------------------------------------------------------------------
# Default is C-b. To switch to the popular C-a, uncomment these three lines:
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# --- quality-of-life keys ----------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
# Splits that inherit the current directory, with intuitive symbols
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# vim-style pane movement (prefix h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- session persistence across server restarts / reboots --------------------
# resurrect: save & restore windows/panes/layouts (prefix Ctrl-s / Ctrl-r)
# continuum: auto-save on an interval and auto-restore when the server starts
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM — keep this as the LAST line.
# One-time setup of TPM itself is in the README; then press `prefix + I`.
run '~/.config/tmux/plugins/tpm/tpm'
